name: Build & Push Backend to Tower

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Tower registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TOWER_REGISTRY_HOST }}
          username: ${{ secrets.TOWER_REGISTRY_USERNAME }}
          password: ${{ secrets.TOWER_REGISTRY_PASSWORD }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.TOWER_REGISTRY_HOST }}/backend:latest
            ${{ secrets.TOWER_REGISTRY_HOST }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
